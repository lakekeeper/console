[package]
name = "lakekeeper-console"
version = "0.33.1"
edition = "2021"
resolver = "2"
homepage = "https://github.com/lakekeeper/lakekeeper"
repository = "https://github.com/lakekeeper/console.git"
rust-version = "1.80.0"
license = "Apache-2.0"

[features]
all = []

[dependencies]
bytes = "1"
# Debug builds embed the files too, so a debug binary runs without its build folder.
rust-embed = { version = "^8.4", features = ["interpolate-folder-path", "debug-embed"] }
mime_guess = { version = "^2.0" }
moka = { version = "^0.12", features = ["sync"] }
flate2 = "1.0"
serde_json = "1"
xxhash-rust = { version = "0.8.12", features = ["xxh3"] }

[build-dependencies]
fs_extra = "1.3.0"
flate2 = "1.0"
